<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллбэк</title>
    <link rel="stylesheet" href="style5.css">
</head>

<body>
    <script>function showPrompt(html, callback) {
            let div = document.createElement('div');
            div.id = 'prompt-form-container';
            div.innerHTML = `<form id="prompt-form"><div id="prompt-message">${html}</div><input type="text" name="text" autocomplete="off"><div class="prompt-buttons"><button type="submit">OK</button><button type="button" id="c">ОТМЕНА</button></div></form>`;
            document.body.append(div);

            let form = div.firstElementChild, inp = form.elements.text, btnC = div.querySelector('#c');
            let els = [inp, form.querySelector('button[type="submit"]'), btnC];
            inp.focus();

            function done(val) { div.remove(); document.removeEventListener('keydown', key); callback(val); }

            form.onsubmit = e => { e.preventDefault(); done(inp.value); };
            btnC.onclick = () => done(null);

            function key(e) {
                if (e.key === 'Escape') done(null);
                if (e.key === 'Tab') {
                    let idx = els.indexOf(document.activeElement);
                    if (e.shiftKey && idx === 0) { els[2].focus(); e.preventDefault(); }
                    if (!e.shiftKey && idx === 2) { els[0].focus(); e.preventDefault(); }
                }
            }
            document.addEventListener('keydown', key);
        }




        showPrompt("Введите что-нибудь<br>... умное:)", function (value) {
            alert(value);
        });
    </script>

</body>

</html>
