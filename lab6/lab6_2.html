<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейсхолдер</title>
    <style>
        body {
            margin: 0;
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        ::placeholder {
            color: blue;
        }

        .testwrap {
            position: relative;
            margin-top: 20px;
            width: 250px;
        }

        .testwrap::before {
            content: attr(data-placeholder);
            position: absolute;
            left: 10px;
            top: 40%;
            transform: translateY(-50%);
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .testwrap.placeholder::before {
            color: blue;
        }

        .testwrap.focused::before,
        .testwrap.notEmpty::before {
            top: -22px;
            transform: translateY(0);
            font-size: 12px;
            color: gray;
            /* Цвет подсказки сверху */
        }

        .testwrap textarea {
            width: 100%;
            resize: none;
            overflow: hidden;
            box-sizing: border-box;
            min-height: 30px;
        }
    </style>
</head>

<body>

    <div class="testwrap placeholder" data-placeholder="Введите вводимый ввод">
        <textarea id="dataInput" rows="1"></textarea>
    </div>

    <script>
        'use strict'

        const wrapper = document.querySelector('.testwrap');
        const input = document.getElementById('dataInput');

        input.addEventListener('focus', () => {
            wrapper.classList.remove('placeholder');
            wrapper.classList.add('focused');
        });

        input.addEventListener('blur', () => {
            wrapper.classList.remove('focused');

            if (input.value.trim() === '') {
                wrapper.classList.add('placeholder');
                wrapper.classList.remove('notEmpty');
            } else {
                wrapper.classList.add('notEmpty');
            }
        });

        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = input.scrollHeight + 'px';
        });
    </script>

</body>

</html>
