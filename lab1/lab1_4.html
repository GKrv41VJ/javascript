<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #result {
            box-sizing: border-box;
            max-width: fit-content;
            margin-top: 20px;
            padding-left: 20px;
            padding-right: 20px;
            border-style: solid;
            border-width: 1px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h1>Простые числа</h1>
    <form id="PrimeForm">
        <div>
            <label for="num">Введите num:</label>
            <input type="number" id="num" required>
            <button type="button" id="CrowButton">Найти</button>
            <div id="result"></div>
        </div>
    </form>

    <script>
        "use strict";
        function PrimeMain(event) {
            event.preventDefault();

            const num = parseInt(document.getElementById("num").value);
            const resultDiv = document.getElementById('result');

            if (isNaN(num) || num < 2) {
                resultDiv.innerHTML = '<p>Пожалуйста, введите число больше или равное 2</p>';
                return;
            }


            const primes = findPrimes(num);

            if (primes.length === 0) {
                resultDiv.innerHTML = '<p>Простых чисел не найдено</p>';
            } else {
                resultDiv.innerHTML = `
                    <p>Простые числа от 2 до ${num}:</p>
                    <div>${primes.map(num => `<span class="prime">${num}</span>`).join(' ')}</div>
                    <p>Всего: ${primes.length}</p>
                `;
            }

        };

        function findPrimes(max) {
            const a = [];
            const primes = [];

            for (let i = 2; i <= max; ++i) {
                if (!a[i]) {
                    primes.push(i);
                    for (let j = i * 2; j <= max; j += i) {
                        a[j] = true;
                    }
                }
            }

            return primes;
        };

        document.getElementById('CrowButton').addEventListener('click', PrimeMain);
    </script>
